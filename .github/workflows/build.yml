name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14  # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -e ".[web,verify,tray-macos,build]"

      - name: Download slskd binary
        run: |
          python -c "from ezsk.slskd_manager import download_slskd; download_slskd(verbose=True)"

      - name: Build with PyInstaller
        run: |
          pyinstaller build/ezsk.spec --noconfirm

      - name: Bundle slskd binary
        run: |
          SLSKD_BIN="$(python -c "from ezsk.slskd_manager import _slskd_binary_path; print(_slskd_binary_path())")"
          if [ -f "$SLSKD_BIN" ]; then
            mkdir -p dist/ezsk.app/Contents/Resources/bin
            cp "$SLSKD_BIN" dist/ezsk.app/Contents/Resources/bin/slskd
            chmod +x dist/ezsk.app/Contents/Resources/bin/slskd
          fi

      - name: Create DMG
        run: |
          hdiutil create -volname ezsk -srcfolder dist/ezsk.app -ov dist/ezsk-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ezsk-macos-arm64
          path: dist/ezsk-macos-arm64.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -e ".[web,verify,tray-windows,build]"

      - name: Download slskd binary
        run: |
          python -c "from ezsk.slskd_manager import download_slskd; download_slskd(verbose=True)"

      - name: Build with PyInstaller
        run: |
          pyinstaller build/ezsk.spec --noconfirm

      - name: Bundle slskd binary
        shell: bash
        run: |
          SLSKD_BIN="$(python -c "from ezsk.slskd_manager import _slskd_binary_path; print(_slskd_binary_path())")"
          if [ -f "$SLSKD_BIN" ]; then
            mkdir -p dist/ezsk/bin
            cp "$SLSKD_BIN" dist/ezsk/bin/slskd.exe
          fi

      - name: Create zip
        shell: bash
        run: |
          cd dist && 7z a -tzip ../ezsk-windows-x64.zip ezsk/

      - uses: actions/upload-artifact@v4
        with:
          name: ezsk-windows-x64
          path: ezsk-windows-x64.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/ezsk-macos-arm64/ezsk-macos-arm64.dmg
            artifacts/ezsk-windows-x64/ezsk-windows-x64.zip
